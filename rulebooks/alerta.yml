---
- name: Webhook de alerta
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Lanzar fact cuando alerta es 1
      condition: event.payload.alerta == 1 or event.payload.alerta == "1"
      action:
        run_job_template:
          name: fact
          organization: Default
